<script>


let voiceLimit = 5;

let voiceUsed = 0;
let words = [];
let wrongWords = [];


//保存当前随机出来的单词
let currentWords = [];
//随机种子
let seed = null;
let mode="self";

let timeOver = false;
//读取普通词库

fetch('/data/words.xlsx?t=' + Date.now())

.then(response=>response.arrayBuffer())

.then(data=>{


    let workbook=XLSX.read(data);
    
    //从 Excel 文件中选择第一个工作表（Sheet）。
    let sheet=
    workbook.Sheets[
        workbook.SheetNames[0]
    ];


    let result=
    XLSX.utils.sheet_to_json(sheet);
    console.log(result);
    
    words =
    result.map(item=>({
        
        word:String(item.word).trim(),
        
        note:String(item.note).trim()
        
    }))
    .filter(item=>item.word!="undefined" && item.note!="undefined");



    //显示词库数量
    
    document
    .getElementById("word-count-info")
    .innerHTML =
    "词库数量：" + words.length + " 个";


});





//读取错题词库

fetch('/data/wrong_words.xlsx')

.then(response=>response.arrayBuffer())

.then(data=>{


    let workbook=XLSX.read(data);


    let sheet=
    workbook.Sheets[
        workbook.SheetNames[0]
    ];


    let result=
    XLSX.utils.sheet_to_json(sheet);



wrongWords =
[
    ...new Map(
        result
        .map(item=>[
            item.word,
            {
                word:item.word,
                note:item.note
            }
        ])
    ).values()
];
    


});

function changeMode(){

    let btn =
    document.getElementById("mode-btn");


    let seedArea =
    document.getElementById("seed-area");


    let voiceArea =
    document.getElementById("voice-area");


    if(mode==="self"){


        //进入模拟考试

        mode="exam";


        btn.innerHTML="返回自测模式";


        seedArea.style.display="flex";


        voiceArea.style.display="none";


    }
    else{


        //返回自测模式

        mode="self";


        btn.innerHTML="进入模拟考试模式";


        seedArea.style.display="none";


        voiceArea.style.display="flex";


    }


}
//点击按钮随机显示 

function test(){


    let count =
    Number(
    document.getElementById("word-count").value
    );


    if(mode==="exam"){

        //考试模式：自动计算
        voiceLimit =
        Math.floor(count / 10);

    }
    else{

        //自测模式：读取输入框
        voiceLimit =
        Number(
        document.getElementById("voice-limit").value
        );

    }


    voiceUsed=0;


    document
    .getElementById("voice-left")
    .innerHTML =
    voiceLimit;
    timeOver=false;
    if(words.length===0){
    
        alert("普通词库正在加载，请稍等");
    
        return;
    
    }


    //读取随机种子

if(mode==="exam"){


    //模拟考试模式

    let seedValue =
    document
    .getElementById("seed")
    .value;


    seed = Number(seedValue);


}
else{


    //自测模式

    seed =
    Math.floor(
        Math.random()*100000
    );


}  
 

// 根据单词数量计算时间

let testTime=count*10;


// 开始倒计时

startCountdown(testTime);

    // 理论需要错题数量（40%）
    
    let targetWrong = Math.ceil(count * 0.4);


    // 实际错题数量
    
    let wrongCount;
     
    if(wrongWords.length < targetWrong){
    
        // 错题不足40%，全部显示
    
        wrongCount = wrongWords.length;
    
    }
    
    else{
    
        // 错题足够，只取40%
    
        wrongCount = targetWrong;
    
    }



    // 普通词补足数量
    
    let normalCount = count - wrongCount;




    // ==================
    // 随机错题
    // ==================
    
    let wrongTemp =
    shuffle(
        [...wrongWords]
    );


    let selectedWrong =
    wrongTemp.slice(
        0,
        wrongCount
    );





    // ==================
    // 随机普通词
    // ==================
    
    let normalTemp =
    shuffle(
        [...words]
    );


    let selectedNormal =
    normalTemp.slice(
        0,
        normalCount
    );





    // 合并
    
    let selected =
    [
        ...selectedWrong,
        ...selectedNormal
    ];




    // 最后整体打乱
    
    selected =
    shuffle(selected);
    // 去除同一个单词的中英文重复
    let usedWords = new Set();
    let usedNotes = new Set();


    selected = selected.filter(item=>{


        if(
            usedWords.has(item.word) ||
            usedNotes.has(item.note)
        ){

            return false;

        }


        usedWords.add(item.word);

        usedNotes.add(item.note);


        return true;


    });



     


currentWords = selected;


document
.getElementById("word-list")
.innerHTML =


        selected
        .map((item,index)=>{


            let number=index+1;


            // 随机显示英文或者中文

            let showEnglish = seededRandom()<0.5;


            let question;


            if(showEnglish){

                question=item.word;

            }
            else{

                question=item.note;

            }



            return `

            <div class="word-card">


            <div class="question">

            ${number}. ${question}

            </div>

       


        <div class="answer-area">


        <button
        class="speak-btn"
        id="speak-${index}"
        onclick="speak('${item.word}',${index})">
        🔊
        </button>


        <input

        class="answer-input"

        id="answer-${index}"

        placeholder="请输入答案">


        </div>



            <div

            class="result"

            id="result-${index}">

            </div>


            </div>


            `;


        })
        .join(""); 

}
 
function showAnswer(){


    currentWords.forEach((item,index)=>{


        let userAnswer =
        document
        .getElementById(
            "answer-"+index
        )
        .value
        .trim();



        let result =
        document
        .getElementById(
            "result-"+index
        );



        let answer;


        // 判断输入方向

        let question =
        document
        .querySelectorAll(".question")
        [index]
        .innerText;

        answer=item.note;

        if(question.includes(item.word)){


            //显示英文，需要回答中文

            answer=item.note;


            result.innerHTML= answer;


        }

        else{


            //显示中文，需要回答英文

            answer=item.word;

            result.innerHTML= answer;


        }
        result.innerHTML =  answer ;


    });


}
function seededRandom(){


    seed =
    (seed * 9301 + 49297) % 233280;


    return seed / 233280;


}
function shuffle(array){


    for(
        let i=array.length-1;
        i>0;
        i--
    ){


        let randomValue;


        if(mode==="exam"){

            randomValue=seededRandom();

        }
        else{

            randomValue=Math.random();

        }


        let j =
        Math.floor(
            randomValue*(i+1)
        );



        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];


    }


    return array;

}
function speak(word,index){



    if(voiceUsed>=voiceLimit){

        alert("语音提示次数已用完");

        return;

    }



    voiceUsed++;



    // 更新固定状态栏

    document
    .getElementById("voice-left")
    .innerHTML =
    voiceLimit-voiceUsed;



    // 模拟考试扣时间

    if(mode==="exam"){


        totalSeconds -= 5;


        if(totalSeconds < 0){

            totalSeconds=0;

        }


        updateCountdown();

    }



    let speech =
    new SpeechSynthesisUtterance(word);


    speech.lang="en-US";

    speech.rate=1;


    window.speechSynthesis.speak(speech);


}
 

let timer=null;

let totalSeconds=0;

let isPaused=false;



function startCountdown(seconds){


    clearInterval(timer);


    totalSeconds=seconds;

    isPaused=false;


    updateCountdown();


    timer=setInterval(()=>{


        if(!isPaused){


            totalSeconds--;

            updateCountdown();


            if(totalSeconds<=0){


                clearInterval(timer);

                timer=null;


                timeOver=true;


                document
                .querySelectorAll(".answer-input")
                .forEach(input=>{

                    input.disabled=true;

                    input.placeholder="时间结束";

                });


            }


        }


    },1000);


}
function pauseTimer(){


    isPaused=true;


}
function resumeTimer(){


    if(totalSeconds>0){

        isPaused=false;

    }


}


function updateCountdown(){


    let min=
    Math.floor(totalSeconds/60);


    let sec=
    totalSeconds%60;


    document
    .getElementById("timer")
    .innerHTML=
    min+
    ":"+
    String(sec).padStart(2,"0");


}
 

function goTop(){

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}

window.onload=function(){

    document
    .getElementById("seed-area")
    .style.display="none";


    document
    .getElementById("mode-btn")
    .innerHTML="进入模拟考试模式";


    mode="self";

};

 
</script>
